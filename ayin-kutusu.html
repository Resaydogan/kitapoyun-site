<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex, nofollow">
<title>kitapoyun · Ayın kutusu</title>
<link rel="icon" href="assets/hediye.png">
<style>
body{margin:0;background:#FFFFFF;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#4F4F4F}
a{color:#137A70}a:hover{color:#1F1F1F}
</style>
<style>#app{display:flex;justify-content:center}</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:50;background:#1F1F1F;color:#FFFFFF;font:700 15px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:10px 16px">Bu, kitapoyun’un tanıtım ve test sürümüdür. Satış, ödeme ve üyelik henüz açık değil; formlara yazdıkların hiçbir yere gönderilmez.</div>
<div id="app"></div>
<template id="dc-template">

<div style="width: 1440px; height: 2300px; display: flex; flex-direction: column; background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #4F4F4F">

<header style="height: 96px; flex-shrink: 0; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-bottom: 1px solid #F0E9D8">
<a href="index.html" aria-label="kitapoyun ana sayfa" style="display: flex"><img src="assets/logo.png" alt="kitapoyun" style="height: 52px; width: auto"></a>
<nav aria-label="Ana menü" style="display: flex; gap: 32px; font-size: 16px; font-weight: 700">
<a href="index.html" style="color: #4F4F4F; text-decoration: none">Kutular</a>
<a href="ayin-kutusu.html" style="color: #137A70; text-decoration: none">Ayın kutusu</a>
<a href="index.html" style="color: #4F4F4F; text-decoration: none">Nasıl çalışır?</a>
<a href="index.html" style="color: #4F4F4F; text-decoration: none">Kâşif haritası</a>
<a href="index.html" style="color: #4F4F4F; text-decoration: none">Kulüp</a>
<a href="sss.html" style="color: #4F4F4F; text-decoration: none">SSS</a>
</nav>
<div style="display: flex; gap: 12px; align-items: center">
<a href="giris.html" style="height: 48px; padding: 0 22px; display: flex; align-items: center; border-radius: 16px; border: 2px solid #4F4F4F; color: #4F4F4F; font-weight: 800; text-decoration: none">Giriş yap</a>
<a href="abone-ol.html" style="height: 48px; padding: 0 24px; display: flex; align-items: center; border-radius: 16px; background: #FFC43D; color: #1F1F1F; font-weight: 800; text-decoration: none; border: 2px solid #1F1F1F">Abone ol</a>
</div>
</header>

<section style="padding: 64px 64px 48px; display: flex; flex-direction: column; gap: 20px; background: #FFF4D6">
<div style="font-size: 15px; font-weight: 700"><a href="index.html" style="color: #137A70">Ana sayfa</a> / Ayın kutusu</div>
<h1 style="margin: 0; font-size: 72px; line-height: 1; font-weight: 900; color: #1F1F1F">[AY] 2026 kutusu</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; max-width: 820px">Bu ayın teması duygular ve robotlar. Kutular [TARİH] tarihine kadar verilen siparişlerle birlikte ayın ilk [X] günü içinde yola çıkıyor.</p>
<div role="tablist" aria-label="Yaş kutusu" style="display: flex; gap: 12px; margin-top: 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</section>

<section style="padding: 64px; display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 56px">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="{{heroStyle}}">
<div style="font-size: 96px; font-weight: 900; line-height: 1">{{current.age}}</div>
<div style="font-size: 26px; font-weight: 900">{{current.name}}</div>
<div style="font-size: 16px; font-weight: 700">yaş kutusu</div>
</div>
<div style="padding: 24px; border-radius: 20px; background: #E8F6F4; font-size: 16px; line-height: 1.55"><strong style="color: #1F1F1F">Kitap sende zaten var mı?</strong> Duyurulan iki kitaptan biri evde varsa [TARİH]'e kadar panelden bu ayı atlayabilir ya da bize yazabilirsin.</div>
<a href="abone-ol.html" style="height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #FFC43D; border: 2px solid #1F1F1F; color: #1F1F1F; font-size: 18px; font-weight: 900; text-decoration: none">Bu kutuya abone ol</a>
</div>
<div style="display: flex; flex-direction: column; gap: 28px">
<h2 style="margin: 0; font-size: 36px; font-weight: 900; color: #1F1F1F">Kutunun içinde</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{current.items}}" as="it" hint-placeholder-count="6">
<div style="padding: 24px; border-radius: 20px; border: 2px solid #F0E9D8; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 900; letter-spacing: 1.5px; color: #137A70">{{it.kind}}</div>
<div style="font-size: 21px; font-weight: 900; color: #1F1F1F">{{it.title}}</div>
<div style="font-size: 16px; line-height: 1.5">{{it.note}}</div>
</div>
</sc-for>
</div>
<h3 style="margin: 12px 0 0; font-size: 28px; font-weight: 900; color: #1F1F1F">Bu ayın etkinlik sayfaları</h3>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{current.activities}}" as="a" hint-placeholder-count="5">
<div style="height: 150px; padding: 18px; box-sizing: border-box; border-radius: 16px; background: #FFF4D6; border: 2px dashed #1F1F1F; display: flex; flex-direction: column; justify-content: space-between">
<div style="font-size: 28px; font-weight: 900; color: #1F1F1F">{{a.n}}</div>
<div style="font-size: 15px; font-weight: 800; line-height: 1.3; color: #1F1F1F">{{a.title}}</div>
</div>
</sc-for>
</div>
</div>
</section>

<section style="padding: 80px 64px; display: flex; flex-direction: column; gap: 40px; background: #E8F6F4">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 820px">
<div style="font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #137A70">KİTABI TANIYALIM</div>
<h2 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 900; color: #1F1F1F">Robotlar da Çorap Giyer</h2>
<p style="margin: 0; font-size: 19px; line-height: 1.6">Res ile Pes seni dört robot arkadaşlarıyla tanıştırıyor. Her robotun bir şekli, bir duygusu ve kayıp bir çorabı var. Desenli çorapları doğru robotla eşleştirirken duyguları tanıyor, robotlarla birlikte hareket ediyorsun. Kitabın sonunda üç sayfalık akordeon katlamalı dev robot açılıyor.</p>
<div style="font-size: 16px; font-weight: 800; color: #1F1F1F">Yazan: Resul [SOYAD] · İmzalı · [SAYFA] sayfa · [YAYINEVİ]</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<div style="padding: 28px; border-radius: 24px; background: #FFFFFF; border: 2px solid #1F1F1F; display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
<svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true"><rect x="12" y="16" width="56" height="56" rx="8" fill="#1FA89B" stroke="#1F1F1F" stroke-width="3"></rect><circle cx="30" cy="38" r="4" fill="#1F1F1F"></circle><circle cx="50" cy="38" r="4" fill="#1F1F1F"></circle><path d="M28 52 Q40 62 52 52" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"></path></svg>
<div style="font-size: 24px; font-weight: 900; color: #1F1F1F">Muni</div>
<div style="font-size: 16px">Kare · mutlu</div>
</div>
<div style="padding: 28px; border-radius: 24px; background: #FFFFFF; border: 2px solid #1F1F1F; display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
<svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true"><polygon points="40,8 74,72 6,72" fill="#5B5BD6" stroke="#1F1F1F" stroke-width="3" stroke-linejoin="round"></polygon><circle cx="32" cy="50" r="3.5" fill="#1F1F1F"></circle><circle cx="48" cy="50" r="3.5" fill="#1F1F1F"></circle><path d="M32 64 Q40 57 48 64" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"></path></svg>
<div style="font-size: 24px; font-weight: 900; color: #1F1F1F">Buri</div>
<div style="font-size: 16px">Üçgen · üzgün</div>
</div>
<div style="padding: 28px; border-radius: 24px; background: #FFFFFF; border: 2px solid #1F1F1F; display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
<svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="42" r="32" fill="#FF6B5B" stroke="#1F1F1F" stroke-width="3"></circle><circle cx="30" cy="34" r="4" fill="#1F1F1F"></circle><circle cx="50" cy="34" r="4" fill="#1F1F1F"></circle><circle cx="40" cy="54" r="7" fill="#1F1F1F"></circle></svg>
<div style="font-size: 24px; font-weight: 900; color: #1F1F1F">Bubu</div>
<div style="font-size: 16px">Daire · şaşkın</div>
</div>
<div style="padding: 28px; border-radius: 24px; background: #FFFFFF; border: 2px solid #1F1F1F; display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
<svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true"><path d="M40 74 C0 46 10 6 40 22 C70 6 80 46 40 74 Z" fill="#6BBF59" stroke="#1F1F1F" stroke-width="3" stroke-linejoin="round"></path><path d="M24 30 L34 35 M56 30 L46 35" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"></path><circle cx="32" cy="41" r="3.5" fill="#1F1F1F"></circle><circle cx="48" cy="41" r="3.5" fill="#1F1F1F"></circle><path d="M32 54 H48" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"></path></svg>
<div style="font-size: 24px; font-weight: 900; color: #1F1F1F">Medi</div>
<div style="font-size: 16px">Kalp · kızgın</div>
</div>
</div>
</section>

<section style="padding: 80px 64px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<div style="padding: 40px; border-radius: 24px; background: #FFC43D; border: 2px solid #1F1F1F; display: flex; gap: 28px; align-items: center">
<div style="width: 120px; height: 120px; flex-shrink: 0; border-radius: 60px; background: #FFFFFF; border: 3px dashed #1F1F1F; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #1F1F1F">?</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 26px; font-weight: 900; color: #1F1F1F">Bu ayın kâşifi</div>
<div style="font-size: 17px; line-height: 1.5; color: #1F1F1F">Kim olduğu kutuyu açınca belli olacak. Haritanda boş duran bir sonraki durağa yapıştırmayı unutma!</div>
</div>
</div>
<div style="padding: 40px; border-radius: 24px; background: #FFFFFF; border: 2px solid #1F1F1F; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 26px; font-weight: 900; color: #1F1F1F">Kulüp buluşması: Resul [SOYAD] ile</div>
<div style="font-size: 17px; line-height: 1.5">[TARİH], [SAAT] · Online. Robotlarını, çoraplarını ve sorularını getir. Bağlantı üye panelinde.</div>
<a href="panel.html" style="align-self: flex-start; margin-top: 8px; height: 48px; padding: 0 22px; display: flex; align-items: center; border-radius: 16px; border: 2px solid #1F1F1F; color: #1F1F1F; font-weight: 900; text-decoration: none">Panelde gör</a>
</div>
</section>

<footer style="flex-grow: 1; padding: 48px 64px; background: #1F1F1F; color: #FFFFFF; display: flex; justify-content: space-between; align-items: flex-start; font-size: 15px">
<span style="font-weight: 800">kitapoyun · Okudukça oyna, oynadıkça oku.</span>
<span style="display: flex; gap: 24px"><a href="sss.html" style="color: #FFFFFF">SSS</a><a href="sss.html" style="color: #FFFFFF">İletişim</a><a href="https://www.instagram.com/kitapoyuncom" style="color: #FFFFFF">@kitapoyuncom</a></span>
</footer>
</div>
</template>
<script src="assets/runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { age: '35' }; }
  renderVals() {
    const boxes = {
      '35': { age: '3–5', name: 'Minik kâşifler', color: '#FF6B5B', ink: '#1F1F1F',
        items: [
          { kind: 'KİTAP 1 · İMZALI', title: 'Robotlar da Çorap Giyer', note: 'Resul [SOYAD]. Dört robot, dört duygu, kayıp çoraplar.' },
          { kind: 'KİTAP 2 · İMZALI', title: '[KİTAP ADI]', note: '[YAZAR] · [KISA AÇIKLAMA]' },
          { kind: 'SÜRPRİZ KİTAP', title: 'Kendi zarfında', note: 'Kutuyu açınca öğreneceksin.' },
          { kind: 'OYUNCAK', title: '[OYUNCAK]', note: 'Robot temalı, 3 yaş üstüne uygun, küçük parçasız.' },
          { kind: 'STICKER SAYFASI', title: 'Robotlar ve çoraplar', note: 'Etkinliklerde de kullanılıyor.' },
          { kind: 'KÂŞİF STICKER', title: 'Ayın kâşifi', note: 'Haritandaki sıradaki durağa.' }
        ],
        activities: ['Çorabı robotuna bul', 'Duygu yüzleri', 'Robot dansı', 'Kaç çorap var?', 'Kendi robotunu boya'] },
      '68': { age: '6–8', name: 'Kâşifler', color: '#6BBF59', ink: '#1F1F1F',
        items: [
          { kind: 'KİTAP 1 · İMZALI', title: 'Robotlar da Çorap Giyer', note: 'Resul [SOYAD]. Okurken hareket et, duyguları tanı.' },
          { kind: 'KİTAP 2 · İMZALI', title: '[KİTAP ADI]', note: '[YAZAR] · [KISA AÇIKLAMA]' },
          { kind: 'SÜRPRİZ KİTAP', title: 'Kendi zarfında', note: 'Kutuyu açınca öğreneceksin.' },
          { kind: 'OYUNCAK', title: '[OYUNCAK]', note: 'Robot temalı, 6 yaş üstüne uygun.' },
          { kind: 'STICKER SAYFASI', title: 'Robot parçaları', note: 'Kendi robotunu sticker ile kur.' },
          { kind: 'KÂŞİF STICKER', title: 'Ayın kâşifi', note: 'Haritandaki sıradaki durağa.' }
        ],
        activities: ['Duygu dedektifi', 'Çorap desenini tamamla', 'Robot komutları', 'Robotunun hikâyesi', 'Dev robotu kur'] },
      '912': { age: '9–12', name: 'Usta kâşifler', color: '#5B5BD6', ink: '#FFFFFF',
        items: [
          { kind: 'KİTAP 1 · İMZALI', title: '[KİTAP ADI]', note: '[YAZAR] · [KISA AÇIKLAMA]' },
          { kind: 'KİTAP 2', title: '[KİTAP ADI]', note: '[YAZAR] · [KISA AÇIKLAMA]' },
          { kind: 'SÜRPRİZ KİTAP', title: 'Kendi zarfında', note: 'Kutuyu açınca öğreneceksin.' },
          { kind: 'OYUNCAK', title: '[OYUNCAK / OYUN]', note: 'Strateji ya da yapım oyunu.' },
          { kind: 'STICKER SAYFASI', title: '[TEMA]', note: 'Günlük ve defter süsleme.' },
          { kind: 'KÂŞİF KARTI', title: 'Ayın kâşifi', note: 'Koleksiyon albümündeki yerine.' }
        ],
        activities: ['[ETKİNLİK 1]', '[ETKİNLİK 2]', '[ETKİNLİK 3]', '[ETKİNLİK 4]', '[ETKİNLİK 5]'] }
    };
    const order = ['35', '68', '912'];
    const cur = boxes[this.state.age];
    const tabs = order.map((k) => {
      const b = boxes[k], sel = k === this.state.age;
      return {
        label: b.age + ' yaş', selected: sel ? 'true' : 'false',
        pick: () => this.setState({ age: k }),
        style: 'height: 52px; padding: 0 24px; border-radius: 16px; border: 2px solid #1F1F1F; font: inherit; font-size: 17px; font-weight: 900; cursor: pointer; background: ' + (sel ? b.color : '#FFFFFF') + '; color: ' + (sel ? b.ink : '#1F1F1F') + ';'
      };
    });
    return {
      tabs: tabs,
      current: { age: cur.age, name: cur.name, items: cur.items, activities: cur.activities.map((t, i) => ({ n: String(i + 1), title: t })) },
      heroStyle: 'height: 300px; padding: 32px; box-sizing: border-box; border-radius: 24px; border: 2px solid #1F1F1F; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; background: ' + cur.color + '; color: ' + cur.ink + ';'
    };
  }
}
mountDC(Component);
</script>
</body>
</html>
