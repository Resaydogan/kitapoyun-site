<script>
class Component extends DCLogic {
  renderVals() {
    const fills = ['#FFC43D', '#1FA89B', '#FF6B5B', '#6BBF59', '#5B5BD6'];
    const stops = [];
    for (let i = 0; i < 12; i++) {
      const done = i < 5, last = i === 11;
      stops.push({
        n: last ? '★' : String(i + 1),
        label: done ? '[KÂŞİF ' + (i + 1) + ']' : (last ? 'Oyun + %20' : 'Bekliyor'),
        style: 'width: 72px; height: 72px; border-radius: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; ' +
          (done ? 'background: ' + fills[i] + '; border: 3px solid #1F1F1F; color: ' + (i === 4 ? '#FFFFFF' : '#1F1F1F') + ';'
                : (last ? 'background: #FFF4D6; border: 3px dashed #1F1F1F; color: #1F1F1F;' : 'background: #FFFFFF; border: 3px dashed #4F4F4F; color: #4F4F4F;'))
      });
    }
    const past = [
      { month: '[AY] kutusu', books: '[KİTAP] · [KİTAP] · sürpriz: [KİTAP]' },
      { month: '[AY] kutusu', books: '[KİTAP] · [KİTAP] · sürpriz: [KİTAP]' },
      { month: '[AY] kutusu', books: '[KİTAP] · [KİTAP] · sürpriz: [KİTAP]' },
      { month: '[AY] kutusu', books: '[KİTAP] · [KİTAP] · sürpriz: [KİTAP]' }
    ];
    return { stops, past };
  }
}
mountDC(Component);
</script>
