<script>
class Component extends DCLogic {
  renderVals() {
    const pts = [];
    for (let i = 0; i < 12; i++) {
      pts.push({ x: 80 + i * 98, y: 190 + Math.round(95 * Math.sin(i * 1.05)) });
    }
    let d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], c = pts[i];
      const mx = (p.x + c.x) / 2;
      d += ' C ' + mx + ' ' + p.y + ' ' + mx + ' ' + c.y + ' ' + c.x + ' ' + c.y;
    }
    const fills = ['#FFC43D', '#1FA89B', '#FF6B5B', '#6BBF59', '#5B5BD6'];
    const stops = pts.slice(0, 11).map((p, i) => {
      const done = i < 5;
      const base = 'position: absolute; left: ' + (p.x - 34) + 'px; top: ' + (p.y - 34) + 'px; width: 68px; height: 68px; border-radius: 34px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900;';
      const look = done
        ? ' background: ' + fills[i] + '; border: 3px solid #1F1F1F; color: ' + (i === 4 ? '#FFFFFF' : '#1F1F1F') + ';'
        : ' background: #FFFFFF; border: 3px dashed #4F4F4F; color: #4F4F4F;';
      return { label: String(i + 1), style: base + look };
    });
    return { mapPath: d, stops: stops };
  }
}
mountDC(Component);
</script>
